<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>班級點數</title>
<style>
:root{--bg:#eef6fb;--card:#fff;--tx:#23384a;--mut:#6b8294;--pri:#2f8fa8;--bd:#d5e3ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15202a;--card:#1f2e3a;--tx:#e6eef4;--mut:#93a8b8;--pri:#4fb3cc;--bd:#31465a}}
:root[data-theme="dark"]{--bg:#15202a;--card:#1f2e3a;--tx:#e6eef4;--mut:#93a8b8;--pri:#4fb3cc;--bd:#31465a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:12px;max-width:1000px;margin:auto}
h1{margin:4px 0 0;font-size:26px}.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--bd);border-radius:14px;padding:16px 6px;background:var(--card);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer}
.tile span{display:block;font-size:38px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.b{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
button.b.g{background:transparent;color:var(--mut);border:1px solid var(--bd);font-size:13px;padding:6px 10px}
button.b.r{background:transparent;color:#c0453f;border:1px solid #e2b3b0;font-size:13px;padding:6px 10px}
.menu{position:relative;display:inline-block}
.menu .dd{display:none;position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;z-index:9;min-width:110px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.menu.open .dd{display:block}
.menu .dd button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:7px 8px;font-size:14px;cursor:pointer;border-radius:6px}
.menu .dd button:hover{background:var(--bg)}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px;font-size:15px}
.st{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.s{border:2px solid var(--bd);border-radius:12px;padding:8px;text-align:center;cursor:pointer;background:var(--card)}
.s.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 15%,var(--card))}
.s .e{font-size:30px}.s b{display:block}.s small{color:var(--mut)}
.bar{height:16px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f4a259,#5bc0a3)}
.log div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-size:14px}
.pos{color:#2e9d6b;font-weight:700}.neg{color:#d9534f;font-weight:700}
.big{font-size:64px;text-align:center;font-variant-numeric:tabular-nums}
.nav{margin-bottom:6px}
textarea{width:100%;margin-top:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:15px}table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--bd)}</style></head><body>
<h1>🌱 班級點數</h1><div class="sub">小小的行動，讓班級更美好！<span id="stat"></span></div>
<div id="app"></div>
<script>
const SP=[["鯊魚","🦈"],["海豚","🐬"],["龍","🐲"],["貓","🐱"],["狗","🐶"],["雞","🐔"],["老虎","🐯"],["兔子","🐰"]];
const STAGES=["蛋","幼年","成長","進化"],TH=[0,10,30,60];
const ITEMS=[
["A","班級規範－扣分",-1,[["A1","上課干擾秩序"],["A2","上課從事無關事務"],["A3","上課睡眠"],["A4","未完成作業"],["A5","未攜帶課本學習用具"],["A6","未抄寫聯絡簿"],["A7","未完成札記"],["A8","未落實掃地工作"]]],
["B","生活態度－扣分",-1,[["B1","不當或不雅言語"],["B2","不當肢體接觸"],["B3","蓄意干擾他人"],["B4","未愛惜公物"]]],
["C","團體精神－加分",1,[["C1","秩序榮譽"],["C2","整潔榮譽"],["C3","閱讀榮譽"],["C4","團體資料準時繳交"],["C5","維護班級榮譽"]]],
["D","個人表現－加分",1,[["D1","聯絡簿完整確實"],["D2","作業認真準時"],["D3","主動協助班級事務"],["D4","其他良好表現"]]]];
const NAME={};ITEMS.forEach(g=>g[3].forEach(x=>NAME[x[0]]=x[1]));
const codes=ITEMS.slice(0,2).flatMap(g=>g[3].map(x=>x[0]));
const TILES=[["👦","個人點數","stu"],["👥","小組任務","grp"],["🎲","隨機抽點","rnd"],["⏱️","課堂計時","tmr"],["🏪","兌換商店","shop"],["🐱","寵物世界","pet"],["🚩","闖關","quest"],["⚠️","本月預警","warn"],["📥","匯出成績","exp"],["📝","加減分紀錄","logs"]];
let S={stu:[],log:[],sel:[],quest:[30,80,150,250],shop:[["貼紙",5],["免作業券",20],["選座位",15],["小點心",10]]};
try{const x=localStorage.getItem("cp2");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
S.stu.forEach((s,i)=>{if(!s.no)s.no=i+1});
if(S.gv!=2){S.stu.forEach(s=>s.g=0);S.gv=2}
let view="home",timer=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save=()=>{try{localStorage.setItem("cp2",JSON.stringify(S))}catch(e){}push()};
const mk=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const tm=()=>new Date().toTimeString().slice(0,5);
const ss=()=>S.stu.slice().sort((a,b)=>a.no-b.no);
const bal=s=>s.pts-(s.spent||0);
const stage=s=>{let k=0;TH.forEach((t,i)=>{if(s.pts>=t)k=i});return k};
const spi=s=>(s.sp!=null?s.sp:s.no-1)%8;
const pet=s=>{const k=stage(s),e=SP[spi(s)][1];return k==0?"🥚":k==1?e:k==2?e+"✨":"👑"+e};
const total=()=>S.stu.reduce((a,s)=>a+s.pts,0);
const cnt=(id,c)=>S.log.filter(l=>l.id==id&&l.c==c&&l.m==mk()).length;
const warn=s=>codes.reduce((a,c)=>a+Math.floor(cnt(s.id,c)/5),0);
function add(ids,n,why,c){const al=[],m=mk();
 ids.forEach(id=>{const s=S.stu.find(x=>x.id==id);if(!s)return;s.pts+=n;S.log.unshift({id:s.id,n:s.name,no:s.no,d:n,w:why||"",c:c||"",t:tm(),m});
  if(c&&"AB".includes(c[0])){const k=cnt(s.id,c);if(k%5==0)al.push("⚠️ "+s.no+"號 "+s.name+" 本月 "+c+" 累積達 "+k+" 次，記警告一支")}});
 S.log=S.log.slice(0,4000);save();render();if(al.length)setTimeout(()=>alert(al.join("\n")),50)}
window.undo=()=>{const l=S.log.shift();if(!l)return;const s=S.stu.find(x=>x.id==l.id);if(s){if(l.c=="兌換")s.spent-=-l.d;else s.pts-=l.d}save();render()};
function nav(){return view=="home"?"":'<div class="nav"><button class="b g" onclick="go(\'home\')">← 返回</button></div>'}
window.go=v=>{view=v;clearInterval(timer);render()};
function chips(){return `<div class="st">${ss().map(s=>`<div class="s ${S.sel.includes(s.id)?"on":""}" onclick="tog(${s.id})"><div class="e">${pet(s)}</div><b>${s.no} ${esc(s.name)}${warn(s)?" ⚠️"+warn(s):""}</b><small>${s.pts} 分</small></div>`).join("")||"<small>尚無學生，請先貼上名單</small>"}</div>`}
window.tog=id=>{S.sel=S.sel.includes(id)?S.sel.filter(x=>x!=id):[...S.sel,id];render()};
window.paste=rep=>{const L=$("nm").value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(!L.length)return alert("請先貼上名單");
 if(rep&&S.stu.length&&!confirm("將取代全部名單並清除分數與紀錄，確定？"))return;
 const a=rep?[]:S.stu.slice();let nx=a.reduce((m,s)=>Math.max(m,s.no),0)+1;
 L.forEach(l=>{const p=l.split(/[\s,，、]+/).filter(Boolean);let no,nm;if(/^\d+$/.test(p[0])&&p[1]){no=+p[0];nm=p.slice(1).join("")}else{no=nx;nm=p.join("")}nx=Math.max(nx,no+1);
  const e=a.find(s=>s.no==no);if(e)e.name=nm;else a.push({id:Date.now()+a.length,name:nm,no,pts:0,spent:0,pet:no%4,g:0})});
 if(rep)S.log=[];S.stu=a;S.sel=[];save();render()};
window.gen30=()=>{if(S.stu.length&&!confirm("將取代全部名單並清除分數，確定？"))return;S.stu=Array.from({length:30},(_,i)=>({id:Date.now()+i,name:"同學"+(i+1),no:i+1,pts:0,spent:0,pet:(i+1)%4,g:0}));S.log=[];S.sel=[];save();render()};
window.delStu=()=>{if(!S.sel.length||!confirm("刪除選取的學生？"))return;S.stu=S.stu.filter(s=>!S.sel.includes(s.id));S.sel=[];save();render()};
window.qi=c=>{if(!S.sel.length)return alert("請先選擇學生");const g=ITEMS.find(g=>g[3].some(x=>x[0]==c)),ids=S.sel;S.sel=[];add(ids,g[2],c+" "+NAME[c],c)};
window.qa=n=>{if(!S.sel.length)return alert("請先選擇學生");add(S.sel,n,"加分")};
function logHtml(){return `<div class="card log"><b>最近加分紀錄</b>${S.log.slice(0,8).map(l=>`<div><span>${l.no||""} ${esc(l.n)} ${esc(l.w)}</span><span class="${l.d>0?"pos":"neg"}">${l.d>0?"+":""}${l.d} <small>${l.t}</small></span></div>`).join("")||"<div>尚無紀錄</div>"}</div>`}
function items(){return ITEMS.map(g=>`<div class="card"><b style="color:${g[2]<0?"#c0453f":"#2e9d6b"}">${g[0]}　${g[1]}</b><div class="row" style="margin-top:8px">${g[3].map(x=>`<button class="b ${g[2]<0?"r":"g"}" onclick="qi('${x[0]}')">${x[0]} ${x[1]}</button>`).join("")}</div></div>`).join("")}
function render(){const a=$("app");if(!ready){a.innerHTML="<div class='card'>載入中…</div>";return}
 if(stuMode||!canW){a.innerHTML=meHtml();return}
 let h=nav();
 if(view=="home"){h+=`<div class="grid">${TILES.map(t=>`<button class="tile" onclick="go('${t[2]}')"><span>${t[0]}</span>${t[1]}</button>`).join("")}</div>`+logHtml()+`<div class="card"><b>全班總分</b> ${total()} 分　<small>${S.stu.length} 位學生</small></div>`}
 if(view=="stu"){h+=`<div class="card"><b>學生名單</b><small>（每行一位：座號 姓名，可直接從 Excel 貼上；只貼姓名則依序編號）</small>
 <textarea id="nm" rows="4" placeholder="1 王小明&#10;2 李小美&#10;3 陳大華"></textarea>
 <div class="row" style="margin-top:8px"><button class="b" onclick="paste(0)">依座號更新／追加</button><button class="b r" onclick="paste(1)">取代全部名單</button><button class="b g" onclick="gen30()">建立30位空白座號</button></div></div>
 <div class="card">${chips()}<div class="row" style="margin-top:8px"><button class="b g" onclick="S.sel=S.stu.map(s=>s.id);render()">全選</button><button class="b g" onclick="S.sel=[];render()">清除</button><button class="b g" onclick="undo()">↶ 復原上一筆</button><button class="b r" onclick="delStu()">刪除選取</button></div><small>刪錯人可以直接重新貼上名單補回；改名字或座號，用上方文字框改好後按「依座號更新／追加」即可。</small></div>
 <div class="card"><b>直接修改某人的分數</b><small>　適合修正按錯很多次的情況</small>
 <div class="row" style="margin-top:8px">
  <select id="fixWho"><option value="">選擇學生</option>${ss().map(s=>`<option value="${s.id}">${s.no} ${esc(s.name)}（目前 ${s.pts} 分）</option>`).join("")}</select>
  <input id="fixVal" type="number" placeholder="正確分數">
  <button class="b" onclick="fixScore()">確定修改</button>
 </div></div>`+items()+logHtml()}
 if(view=="grp"){const G={0:[],1:[],2:[],3:[],4:[],5:[]};ss().forEach(s=>G[s.g>=1&&s.g<=5?s.g:0].push(s));
 const gc=l=>`<div class="st">${l.map(s=>`<div class="s ${S.sel.includes(s.id)?"on":""}" onclick="tog(${s.id})"><div class="e">${pet(s)}</div><b>${s.no} ${esc(s.name)}</b><small>${s.pts} 分</small></div>`).join("")||"<small>（無）</small>"}</div>`;
 h+=`<div class="card" style="position:sticky;top:0;z-index:5"><b>分組工具</b><small>　先點選學生（可多選），再按要移入的組別</small><div class="row" style="margin-top:8px">${[1,2,3,4,5].map(n=>`<button class="b" onclick="mv(${n})">移到第${n}組</button>`).join("")}<button class="b g" onclick="mv(0)">移出分組</button></div><div class="row" style="margin-top:8px"><button class="b r" onclick="rg(1)">🎲 亂數重新分成5組</button><button class="b g" onclick="rg(0)">🎲 只分配未分組的學生</button><button class="b g" onclick="if(confirm('清除全部分組？')){S.stu.forEach(s=>s.g=0);save();render()}">清除分組</button></div></div><div class="card"><b>逐一指定組別</b><small>　直接用下拉選單選每位學生的組別</small><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin-top:8px">${ss().map(s=>`<label style="display:flex;justify-content:space-between;align-items:center;gap:6px"><span>${s.no} ${esc(s.name)}</span><select onchange="setG(${s.id},this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${(s.g>=1&&s.g<=5?s.g:0)==n?"selected":""}>${n?"第"+n+"組":"未分組"}</option>`).join("")}</select></label>`).join("")}</div></div><div class="card"><b>未分組（${G[0].length}）</b>${gc(G[0])}</div>`+[1,2,3,4,5].map(n=>{const m=G[n];return `<div class="card"><div class="row"><b>第 ${n} 組　${m.length} 人・${m.reduce((a,s)=>a+s.pts,0)} 分</b>${m.length?[1,2,5].map(k=>`<button class="b" onclick="add([${m.map(s=>s.id)}],${k},'小組任務')">全組+${k}</button>`).join(""):""}</div><div style="margin-top:8px">${gc(m)}</div></div>`}).join("")}
 if(view=="rnd"){h+=`<div class="card"><div class="big" id="pick">🎲</div><div class="row" style="justify-content:center"><button class="b" onclick="roll()">抽一位！</button></div></div><div class="card">${chips()}</div><div class="card"><small>抽到的人會自動被選取，可用下方加分或回「個人點數」選項目。</small><div class="row" style="margin-top:8px">${[1,2].map(n=>`<button class="b" onclick="qa(${n})">選取+${n}</button>`).join("")}</div></div>`}
 if(view=="tmr"){h+=`<div class="card"><div class="big" id="clk">05:00</div><div class="row" style="justify-content:center"><input id="min" type="number" value="5" min="1" style="width:70px"> 分鐘 <button class="b" onclick="tstart()">開始</button><button class="b g" onclick="clearInterval(timer)">暫停</button></div></div>`}
 if(view=="shop"){h+=`<div class="card"><small>先點選學生再兌換。餘額＝總得分－已兌換。</small>${chips()}</div>`+S.shop.map((x,i)=>`<div class="card row" style="justify-content:space-between"><b>🎁 ${esc(x[0])}</b><span>${x[1]} 分 <button class="b" onclick="buy(${i})">兌換</button> <span class="menu ${MN=='s'+i?"open":""}"><button class="b g" onclick="togMn('s${i}')">⋯</button><span class="dd"><button onclick="editShop(${i})">修改</button><button onclick="delShop(${i})" style="color:#c0453f">刪除</button></span></span></span></div>`).join("")+`<div class="card"><button class="b g" onclick="addShop()">＋新增兌換項目</button></div>`+`<div class="card"><small>選取學生餘額：${S.sel.map(id=>{const s=S.stu.find(x=>x.id==id);return s?s.no+" "+esc(s.name)+" "+bal(s):""}).join("、")||"—"}</small></div>`}
 if(view=="pet"){h+=`<div class="card"><small>累積分數越高，寵物越進化：${TH.map((t,i)=>STAGES[i]+"("+t+"分)").join(" → ")}</small><div class="row" style="margin-top:8px"><button class="b" onclick="go('pick')">🐾 讓學生選寵物</button><button class="b g" onclick="if(confirm('重新隨機分配全班寵物？')){S.stu.forEach(s=>s.sp=Math.random()*8|0);save();render()}">全班隨機分配寵物</button></div></div><div class="st">${ss().map(s=>{const k=stage(s),nx=TH[k+1],pr=nx?Math.max(0,(s.pts-TH[k])/(nx-TH[k])*100):100;return `<div class="s" style="cursor:default"><div class="e" style="font-size:52px">${pet(s)}</div><b>${s.no} ${esc(s.name)}</b><small>${STAGES[k]}・${s.pts}分</small><select onchange="setSp(${s.id},this.value)" style="margin-top:6px;width:100%">${SP.map((p,i)=>`<option value="${i}" ${spi(s)==i?"selected":""}>${p[1]} ${p[0]}</option>`).join("")}</select><div class="bar" style="margin-top:6px"><i style="width:${pr}%"></i></div></div>`}).join("")}</div>`}
 if(view=="quest"){const t=total();h+=`<div class="card"><b>全班累積 ${t} 分</b><small>（全班一起闖關）</small></div>`+S.quest.map((g,i)=>{const p=Math.max(0,Math.min(100,t/g*100));return `<div class="card"><div class="row" style="justify-content:space-between"><b>${t>=g?"🏆":"🚩"} 第 ${i+1} 關　目標 ${g} 分</b><span class="menu ${MN=='q'+i?"open":""}"><button class="b g" onclick="togMn('q${i}')">⋯</button><span class="dd"><button onclick="setQ(${i})">修改</button><button onclick="delQ(${i})" style="color:#c0453f">刪除</button></span></span></div><div class="bar" style="margin-top:8px"><i style="width:${p}%"></i></div></div>`}).join("")+`<div class="card"><button class="b g" onclick="S.quest.push((S.quest.slice(-1)[0]||0)+100);save();render()">＋新增關卡</button></div>`}
 if(view=="warn"){h+=`<div class="card"><small>${mk()} 月：A、B 各代號分別計算，同一代號當月累積 5 次記警告一支（紅字＝已達 4 次以上）。</small></div><div class="card" style="overflow-x:auto"><table>`+ss().map(s=>{const d=codes.map(c=>[c,cnt(s.id,c)]).filter(x=>x[1]),w=warn(s);return `<tr><td>${s.no}</td><td>${esc(s.name)}</td><td>${d.map(x=>`<span class="${x[1]>=4?"neg":""}">${x[0]}×${x[1]}</span>`).join("　")||"—"}</td><td>${w?`<span class="neg">警告 ${w} 支</span>`:""}</td></tr>`}).join("")+`</table></div>`}
 if(view=="qr"){h+=`<div class="card" style="text-align:center"><b>學生掃描加入</b><div id="qr" style="display:flex;justify-content:center;margin:12px"></div><input value="${esc(QU)}" style="width:100%" onchange="QU=this.value;render()"></div><div class="card"><small>把上方網址換成此頁的分享連結。學生掃描後選座號，即可看到自己的寵物與分數（唯讀）；只有被授權開啟此頁的人能看到。</small></div>`;setTimeout(()=>{const e=$("qr");if(e&&window.QRCode)new QRCode(e,{text:QU,width:220,height:220})},0)}
 if(view=="logs"){h+=`<div class="card"><small>找到不小心按錯的項目，可以直接修改分數或刪除整筆（刪除會把分數退回）。共 ${S.log.length} 筆，僅列出最近 200 筆。</small></div>`+S.log.slice(0,200).map((l,i)=>`<div class="card row" style="justify-content:space-between"><span>${l.no||""} ${esc(l.n)}　${esc(l.w)||"（加分）"}　<small>${l.t}</small></span><span class="${l.d>0?"pos":"neg"}">${l.d>0?"+":""}${l.d} <span class="menu ${MN=='l'+i?"open":""}"><button class="b g" onclick="togMn('l${i}')">⋯</button><span class="dd"><button onclick="editLog(${i})">修改</button><button onclick="delLog(${i})" style="color:#c0453f">刪除</button></span></span></span></div>`).join("")||`<div class="card">尚無紀錄</div>`}
 if(view=="exp"){h+=`<div class="card"><b>匯出成績（CSV，可用 Excel 開啟）</b><div class="row" style="margin-top:8px"><button class="b" onclick="expSum()">本月成績總表</button><button class="b g" onclick="expLog()">全部加減分紀錄</button></div></div><div class="card"><b>備份／換裝置</b><div class="row" style="margin-top:8px"><button class="b" onclick="dl('班級備份_'+mk()+'.json',null,JSON.stringify(S))">匯出備份檔</button><button class="b g" onclick="document.getElementById('bf').click()">匯入備份檔</button><input type="file" accept=".json" id="bf" style="display:none" onchange="imp(this)"></div><small>資料存在此瀏覽器，換電腦或清除瀏覽資料前請先匯出備份。</small></div>`}
 if(view=="pick"){const L=ss(),cur=S.stu.find(x=>x.id==PK)||L.find(s=>s.sp==null)||L[0];if(cur)PK=cur.id;const done=L.filter(s=>s.sp!=null).length;
 h+=`<div class="card"><b>🐾 選寵物</b>　已選 ${done} / ${L.length} 位<div class="st" style="margin-top:8px">${L.map(s=>`<div class="s ${s.id==PK?"on":""}" onclick="PK=${s.id};render()"><div class="e">${s.sp!=null?SP[s.sp][1]:"❓"}</div><b>${s.no} ${esc(s.name)}</b></div>`).join("")||"<small>請先到「個人點數」貼上名單</small>"}</div></div>`+(cur?`<div class="card"><b>${cur.no} 號 ${esc(cur.name)}，請選你的寵物</b><div class="st" style="margin-top:8px">${SP.map((p,i)=>`<div class="s ${cur.sp===i?"on":""}" onclick="choose(${i})"><div class="e" style="font-size:52px">${p[1]}</div><b>${p[0]}</b></div>`).join("")}</div></div><div class="card"><button class="b g" onclick="S.stu.forEach(s=>{if(s.sp==null)s.sp=Math.random()*8|0});save();render()">🎲 尚未選擇的學生隨機分配</button></div>`:"")}
 a.innerHTML=h}
window.setQ=i=>{const v=parseInt(prompt("此關目標分數",S.quest[i]));if(v>0){S.quest[i]=v;save();render()}};
window.delQ=i=>{if(confirm("刪除第 "+(i+1)+" 關？")){S.quest.splice(i,1);save();render()}};
window.addShop=()=>{const n=prompt("項目名稱");if(!n)return;const c=parseInt(prompt("兌換所需分數",10));if(!c)return;S.shop.push([n,c]);save();render()};
window.editShop=i=>{const n=prompt("項目名稱",S.shop[i][0]);if(!n)return;const c=parseInt(prompt("兌換所需分數",S.shop[i][1]));if(!c)return;S.shop[i]=[n,c];save();render()};
window.delShop=i=>{if(confirm("刪除「"+S.shop[i][0]+"」？")){S.shop.splice(i,1);save();render()}};
window.editLog=i=>{const l=S.log[i],s=S.stu.find(x=>x.id==l.id);if(!s)return alert("找不到該學生（可能已被刪除）");const v=parseInt(prompt("修改這筆分數（原為 "+l.d+"）",l.d));if(isNaN(v))return;s.pts+=v-l.d;l.d=v;save();render()};
window.delLog=i=>{const l=S.log[i],s=S.stu.find(x=>x.id==l.id);if(!confirm("刪除這筆「"+(l.w||"加分")+" "+(l.d>0?"+":"")+l.d+"」紀錄？分數會退回。"))return;if(s)s.pts-=l.d;S.log.splice(i,1);save();render()};
let EXS=0,MN=0;
window.togMn=id=>{MN=MN==id?0:id;render()};
window.togEx=id=>{EXS=EXS==id?0:id;render()};
function stuLog(id){const rows=S.log.map((l,i)=>[l,i]).filter(x=>x[0].id==id).slice(0,50);
 return `<div style="margin-top:6px;border-top:1px solid var(--bd);padding-top:6px">${rows.map(([l,i])=>`<div class="row" style="justify-content:space-between;padding:3px 0"><span>${esc(l.w)||"（加分）"}　<small>${l.t}</small></span><span class="${l.d>0?"pos":"neg"}">${l.d>0?"+":""}${l.d} <span class="menu ${MN=='e'+i?"open":""}"><button class="b g" onclick="togMn('e${i}')">⋯</button><span class="dd"><button onclick="editLog(${i})">修改</button><button onclick="delLog(${i})" style="color:#c0453f">刪除</button></span></span></span></div>`).join("")||"<small>此生尚無紀錄</small>"}</div>`}
window.fixScore=()=>{const sel=$("fixWho"),id=+sel.value;if(!id)return alert("請先選擇學生");const s=S.stu.find(x=>x.id==id);const v=parseInt($("fixVal").value);if(isNaN(v)||v<0)return alert("請輸入正確分數");const d=v-s.pts;if(d)S.log.unshift({id:s.id,n:s.name,no:s.no,d,w:"老師修改分數",c:"",t:tm(),m:mk()});s.pts=v;save();render()};
window.editPts=id=>{const s=S.stu.find(x=>x.id==id);if(!s)return;const p=parseInt(prompt(s.no+" 號 "+s.name+"，直接設定累積分數",s.pts));if(isNaN(p)||p<0)return;const sp=parseInt(prompt("已兌換分數",s.spent||0));if(isNaN(sp)||sp<0)return;const d=p-s.pts;if(d)S.log.unshift({id:s.id,n:s.name,no:s.no,d,w:"老師修改分數",c:"",t:tm(),m:mk()});s.pts=p;s.spent=sp;save();render()};
window.editStu=id=>{const s=S.stu.find(x=>x.id==id);if(!s)return;const n=prompt("姓名",s.name);if(!n)return;const no=parseInt(prompt("座號",s.no));if(!no)return;s.name=n;s.no=no;save();render()};
window.delOne=id=>{const s=S.stu.find(x=>x.id==id);if(s&&confirm("刪除 "+s.no+" 號 "+s.name+"？")){S.stu=S.stu.filter(x=>x.id!=id);S.sel=S.sel.filter(x=>x!=id);save();render()}};
window.buy=i=>{const [n,c]=S.shop[i];if(!S.sel.length)return alert("請先選擇學生");S.sel.forEach(id=>{const s=S.stu.find(x=>x.id==id);if(s&&bal(s)>=c){s.spent=(s.spent||0)+c;S.log.unshift({id:s.id,n:s.name,no:s.no,d:-c,w:"兌換"+n,c:"兌換",t:tm(),m:mk()})}else if(s)alert(s.name+" 分數不足")});save();render()};
window.roll=()=>{if(!S.stu.length)return;let k=0,el=$("pick"),iv=setInterval(()=>{const s=S.stu[Math.random()*S.stu.length|0];el.textContent=pet(s)+" "+s.no+" "+s.name;if(++k>14){clearInterval(iv);S.sel=[s.id];save()}},80)};
window.tstart=()=>{clearInterval(timer);let t=(parseInt($("min").value)||5)*60;const f=()=>{$("clk").textContent=String(t/60|0).padStart(2,"0")+":"+String(t%60).padStart(2,"0");if(t--<=0){clearInterval(timer);$("clk").textContent="⏰ 時間到！"}};f();timer=setInterval(f,1000)};
let DBd=null,canW=false,ready=false,stuMode=location.hash=="#s",sync="💾 僅本機",pt=null,last="",me=0,QU="https://claude.ai/artifact/2mZK4SvVVKkU3RbFnniqZW";
try{me=+localStorage.getItem("cpme")||0}catch(e){}
const stat=()=>{const e=$("stat");if(e)e.textContent=sync};
function push(){if(!DBd||!canW)return;clearTimeout(pt);pt=setTimeout(async()=>{try{last=JSON.stringify(Object.assign({},S,{sel:[],log:S.log.slice(0,1500)}));await DBd.set({json:last,t:Date.now()});sync="☁️ 已同步"}catch(e){sync="⚠️ 同步失敗"}stat()},600)}
function adopt(j){try{const sel=S.sel;S=Object.assign(S,JSON.parse(j));S.sel=canW?sel.filter(id=>S.stu.some(s=>s.id==id)):[]}catch(e){}}
window.mv=n=>{if(!S.sel.length)return alert("請先點選學生");S.stu.forEach(s=>{if(S.sel.includes(s.id))s.g=n});S.sel=[];save();render()};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
window.rg=all=>{const ok=s=>s.g>=1&&s.g<=5,L=all?S.stu:S.stu.filter(s=>!ok(s));if(!L.length)return alert("沒有需要分組的學生");if(all&&S.stu.some(ok)&&!confirm("將打散目前分組，確定？"))return;
 if(all){shuf(S.stu.slice()).forEach((s,i)=>s.g=i%5+1)}else{const c=[0,0,0,0,0,0];S.stu.filter(ok).forEach(s=>c[s.g]++);shuf(L.slice()).forEach(s=>{const m=Math.min(c[1],c[2],c[3],c[4],c[5]),o=[1,2,3,4,5].filter(n=>c[n]==m),n=o[Math.random()*o.length|0];s.g=n;c[n]++})}
 save();render()};
let PK=0;
window.setG=(id,v)=>{S.stu.find(x=>x.id==id).g=+v;save();render()};
window.choose=i=>{const cur=S.stu.find(x=>x.id==PK);if(!cur)return;cur.sp=i;const L=ss(),k=L.findIndex(s=>s.id==PK),nx=L.slice(k+1).concat(L.slice(0,k)).find(s=>s.sp==null);if(nx)PK=nx.id;save();render()};
window.setSp=(id,v)=>{S.stu.find(x=>x.id==id).sp=+v;save();render()};
window.pickMe=v=>{me=+v;try{localStorage.setItem("cpme",me)}catch(e){}render()};
function meHtml(){const s=S.stu.find(x=>x.no==me),t=total();
 let h=`<div class="card"><div class="row"><b>我是座號</b><select onchange="pickMe(this.value)"><option value="0">請選擇</option>${ss().map(x=>`<option value="${x.no}" ${x.no==me?"selected":""}>${x.no} ${esc(x.name)}</option>`).join("")}</select></div></div>`;
 if(s){const k=stage(s),nx=TH[k+1],pr=nx?Math.max(0,(s.pts-TH[k])/(nx-TH[k])*100):100;
  h+=`<div class="card" style="text-align:center"><div style="font-size:96px">${pet(s)}</div><b>${esc(s.name)} 的${SP[spi(s)][0]}</b><div>${STAGES[k]}・累積 ${s.pts} 分・可兌換 ${bal(s)} 分</div><div class="bar" style="margin:8px 0"><i style="width:${pr}%"></i></div><small>${nx?"再 "+(nx-s.pts)+" 分進化":"已進化到最高階段！"}</small></div>`}
 const g=S.quest.find(x=>t<x);h+=`<div class="card"><b>🚩 全班闖關</b> ${t} 分${g?`<div class="bar" style="margin-top:8px"><i style="width:${t/g*100}%"></i></div><small>下一關目標 ${g} 分</small>`:" 🏆 全部通關！"}</div>`;
 return h}
const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
async function dl(name,rows,raw){const txt=raw||("\uFEFF"+rows.map(r=>r.map(q).join(",")).join("\r\n"));const b=new Blob([txt],{type:name.endsWith("json")?"application/json":"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const allc=ITEMS.flatMap(g=>g[3].map(x=>x[0]));
window.expSum=()=>dl("班級成績_"+mk()+".csv",[["座號","姓名","累積分數","已兌換","餘額","寵物","階段","本月警告(支)"].concat(allc.map(c=>"本月"+c+"次數"))].concat(ss().map(s=>[s.no,s.name,s.pts,s.spent||0,bal(s),SP[spi(s)][0],STAGES[stage(s)],warn(s)].concat(allc.map(c=>cnt(s.id,c))))));
window.expLog=()=>dl("加減分紀錄_"+mk()+".csv",[["月份","時間","座號","姓名","代號","事項","分數"]].concat(S.log.map(l=>[l.m||"",l.t,l.no||"",l.n,l.c||"",l.w,l.d])));
window.imp=inp=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.stu)throw 0;if(!confirm("匯入會取代目前資料，確定？"))return;S=Object.assign(S,o);S.sel=[];save();render();alert("匯入完成")}catch(e){alert("備份檔格式不正確")}};r.readAsText(f)};
canW=true;ready=true;sync="💾 資料存在此裝置";document.addEventListener("click",e=>{if(MN&&!e.target.closest(".menu")){MN=0;render()}});render();stat();
</script></body></html>
